            "Uptime": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       <p>Returns the number of seconds elapsed since the UserEnv (sandbox) was created.\n    <br><br>\n    This value is relative, not wall-clock time. It does not expose system time,\n    timezone, or date information, and is safe for use inside restricted or sandboxed\n    environments. The uptime origin cannot be reset or modified by sandboxed code.\n    Although the various random functions in the environment have already been seeded with\n    pseudo-random values, this value can be used for additional random seeding if desired.\n    <\/p><\/div><\/div><div class=\"custom-section\"><div id=\"995a2a2f-ea38-6a68-2421-d3d181a62653\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nSeconds<\/em>   Elapsed time in seconds since the UserEnv was initialized.<br><\/div><\/div><div class=\"custom-section\"><div id=\"cde1ba8d-45f9-c77d-c984-860d23ca41c8\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nUptime = Uptime();<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": null
            },
            "base64": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <div class=\"mb-4\">\n\n  <div class=\"d-flex align-items-center mb-3\">\n    <div style=\"width:6px;height:36px;background:#e57373;border-radius:3px;\" class=\"me-3\"><\/div>\n    <h2 class=\"mb-0 fw-bold\">base64<\/h2>\n  <\/div>\n\n  <p>\n    Provides Base64 encoding and decoding utilities for working with binary data\n    in a text-safe form.\n  <\/p>\n\n  <p>\n    This namespace is primarily used for serialization, persistence, and transport\n    of data such as bytecode, packed structures, or other binary blobs that must be\n    represented as strings. Encoded values can be decoded back to their original\n    binary form without loss.\n  <\/p>\n\n<\/div><\/div><\/div><\/div>`,
                "subtable": {
                "dec": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Encodes a string to Base64.<\/div><\/div><div class=\"custom-section\"><div id=\"1633fe7a-b8c3-45a4-f617-ce2c9914c05d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sInput<\/em>   The sting to encode.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2a580eff-1d21-369c-dfeb-91920cbaa33d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEncoded<\/em>   The encoded Base64 string.<br><\/div><\/div><div class=\"custom-section\"><div id=\"aad825bd-b1d7-8d45-0554-35b0acb55217\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local sText     = \"I really like apples but only the glowing, purple ones.\";\n    local sEncoded  = base64.enc(sText);\n    print(sEncoded) --> SSByZWFsbHkgbGlrZSBhcHBsZXMgYnV0IG9ubHkgdGhlIGdsb3dpbmcsIHB1cnBsZSBvbmVzLg==\n    local sDecoded  = base64.dec(sEncoded);\n    print(sDecoded) --> I really like apples but only the glowing, purple ones.\n    print (sText == sDecoded) --> true<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "enc": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Encodes a string to Base64.<\/div><\/div><div class=\"custom-section\"><div id=\"6e747d1e-01ff-e23b-81ef-e1a3884e1e2d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sInput<\/em>   The sting to encode.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b273096c-b92a-2ab7-51c4-f55d2a0dffc2\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEncoded<\/em>   The encoded Base64 string.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b92466b0-5d0a-079e-a869-2cefd73b10a0\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local sText     = \"I really like apples but only the glowing, purple ones.\";\n    local sEncoded  = base64.enc(sText);\n    print(sEncoded) --> SSByZWFsbHkgbGlrZSBhcHBsZXMgYnV0IG9ubHkgdGhlIGdsb3dpbmcsIHB1cnBsZSBvbmVzLg==<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "deserialize": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Reconstructs a Lua value from a serialized Lua-expression string produced by serialize. The input string is executed in a controlled manner to recreate the original value, including complex tables and registered object types.<\/div><\/div><div class=\"custom-section\"><div id=\"5e627991-35be-a578-b55b-2bb45f755132\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sRawData<\/em>   Serialized Lua expression.<br><\/div><\/div><div class=\"custom-section\"><div id=\"05731d7b-2b92-904a-f389-af95fb783193\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vResult<\/em>   Deserialized Lua value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"901dc4a0-6d59-9b92-de23-bb2e47392584\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local sSerializedConfig = \"{ [\\\"Width\\\"] = 1920, [\\\"Height\\\"] = 1080 }\"\n    local tConfigData = deserialize(sSerializedConfig)<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": null
            },
            "geometry": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <div class=\"card border-0 shadow-sm bg-dark text-light mb-3\">\n  <div class=\"card-body\">\n    <div class=\"d-flex align-items-center mb-2\">\n      <div class=\"me-2\" style=\"width:6px;height:32px;background:#ff8f00;border-radius:3px;\"><\/div>\n      <h5 class=\"mb-0 fw-bold text-uppercase letter-spacing-1\">\n        Geometry\n      <\/h5>\n    <\/div>\n\n    <p class=\"mb-2\">\n      Provides geometric helpers for working with rectangles, bounds, and spatial layout.\n      These utilities are designed for hit testing, containment checks, and aspect-ratio–\n      preserving fitting commonly used in drawing, UI composition, and card layout logic.\n    <\/p>\n\n    <p class=\"mb-0 text-muted small\">\n      Focused on clarity and determinism — no scene state, no transforms, just math.\n    <\/p>\n  <\/div>\n<\/div><\/div><\/div><\/div>`,
                "subtable": {
                "fitrect": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Calculates the largest rectangle that fits inside an outer rectangle\n    while preserving the aspect ratio of an inner rectangle.\n    Optionally centers the result within the outer rectangle.<\/div><\/div><div class=\"custom-section\"><div id=\"b2057cd7-8528-68e9-6029-e1f7d59af3c7\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tOuter<\/em>   Rectangle defining the available area (x, y, width, height).   <strong><em>table<\/em><\/strong>   <em>tInner<\/em>   Rectangle defining the original size (width, height).   <strong><em>boolean<\/em><\/strong>   <em>bCenter<\/em>   If true, centers the fitted rectangle within the outer rectangle.<br><\/div><\/div><div class=\"custom-section\"><div id=\"83d225c5-070b-8e6b-0ebb-ec2049e2d2e7\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tResult<\/em>   Rectangle containing width, height, x, and y.<br><\/div><\/div><div class=\"custom-section\"><div id=\"960742d8-d44c-c3df-0f91-b2eb82d90438\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local tFitted = geometry.fitrect(tOuterRect, tImageRect, true)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "rectcontains": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Tests whether two rectangles overlap with a positive intersection area.\n    Returns true only when the rectangles share a non-zero overlapping region.<\/div><\/div><div class=\"custom-section\"><div id=\"7b3a714d-4125-28de-3cb1-54f403995a32\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMe<\/em>   First rectangle (x, y, width, height).   <strong><em>table<\/em><\/strong>   <em>tOther<\/em>   Second rectangle (x, y, width, height).<br><\/div><\/div><div class=\"custom-section\"><div id=\"6a15aa5c-4487-f5a4-eb43-4f3ef25e0c13\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bOverlaps<\/em>   True if the rectangles intersect with positive area.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1ce93916-7467-0862-9fef-277fd27057c4\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local bOverlaps = geometry.rectcontains(tRectA, tRectB)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "rectcontainsfully": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Tests whether one rectangle intersects or encloses another.\n    Unlike rectcontains, edge contact is considered a valid intersection.<\/div><\/div><div class=\"custom-section\"><div id=\"f9a2d258-6005-77e4-1b42-5ddafe1c11a4\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMe<\/em>   First rectangle (x, y, width, height).   <strong><em>table<\/em><\/strong>   <em>tOther<\/em>   Second rectangle (x, y, width, height).<br><\/div><\/div><div class=\"custom-section\"><div id=\"82f466aa-e408-a5c2-f28d-a1c38ea03c26\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bIntersects<\/em>   True if the rectangles intersect in any way.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e355e760-0e1a-30ed-53ad-dce0980bc082\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local bIntersects = geometry.rectcontainsfully(tContainer, tChild)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "ipairs": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns an iterator that traverses a table by increasing integer keys, starting at index 1 and continuing until a nil value is encountered. Intended for array-like tables.<\/div><\/div><div class=\"custom-section\"><div id=\"efc4299f-b077-eb81-a520-25609da4e018\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local t = { \"a\", \"b\", \"c\" }\n    for i, v in ipairs(t) do\n        print(i, v)\n    end<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": null
            },
            "math": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <pre class=\"fw-bold lh-1 mb-2\">\n<span style=\"color:#4d70f1\">\n\n<\/span>\n<\/pre>\n<div class=\"mt-2\">\nProvides mathematical utilities exposed to the user environment. This module includes\nstandard Lua math functionality alongside extended helpers and custom numeric utilities\nimplemented by the engine. In addition to core arithmetic and trigonometry, it offers\nhigher-level helpers for ratios, ranges, randomness, geometry, color math, and numeric\nclassification.\n<\/div><\/div><\/div><\/div>`,
                "subtable": {
                "abs": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Returns the absolute (non-negative) value of a number.<\/div><\/div><div class=\"custom-section\"><div id=\"18cb9598-0b65-78a8-729d-53e47a46f5c1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local v = math.abs(-5)   -- 5<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "acos": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Computes the arc cosine of a value, expressed in radians.\n        The input must be within the range -1 to 1.<\/div><\/div><div class=\"custom-section\"><div id=\"2b66dbde-e188-a957-f798-f7261c89b2bc\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local a = math.acos(1)   -- 0<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "asin": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Computes the arc sine of a value, in radians.\n        Valid only for values between -1 and 1.<\/div><\/div><div class=\"custom-section\"><div id=\"acf44c06-b239-33a8-9d2d-bf461902e4d1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local a = math.asin(0)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "atan": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Returns the arc tangent of a value, measured in radians.<\/div><\/div><div class=\"custom-section\"><div id=\"7f6dd148-dfa5-7cb6-77f8-0cfd73d4ed44\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local a = math.atan(1)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "atan2": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Computes the arc tangent using two coordinates,\n        preserving the correct quadrant of the result.<\/div><\/div><div class=\"custom-section\"><div id=\"730beaa9-3ca6-982a-623d-8fb818fddbe3\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local angle = math.atan2(y, x)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "ceil": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">           Rounds a number upward to the nearest integer\n        that is greater than or equal to the input.<\/div><\/div><div class=\"custom-section\"><div id=\"906ed54f-e735-5aae-0b13-ca04c4f9d737\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local n = math.ceil(2.3)   -- 3<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "clamp": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Constrains a numeric value to lie within a minimum and maximum bound.\n    If the value is smaller than the minimum, the minimum is returned.\n    If the value is larger than the maximum, the maximum is returned.<\/div><\/div><div class=\"custom-section\"><div id=\"42e346ca-77f3-f9ff-c5c9-1bb5f392ac4a\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   Value to clamp.   <strong><em>number<\/em><\/strong>   <em>nMinValue<\/em>   Lower bound.   <strong><em>number<\/em><\/strong>   <em>nMaxValue<\/em>   Upper bound.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f60c9c7c-03b7-0768-8330-4a388f17fa34\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nResult<\/em>   Clamped value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"359176a1-9110-9419-20cd-f8f3b7fe5dfd\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    math.clamp(15, 0, 10)   -- 10<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "convertbase": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Converts a numeric string from one base to another.\n    The input is first interpreted using the source base, then re-encoded\n    using the target base.<\/div><\/div><div class=\"custom-section\"><div id=\"1a3278c7-9057-6d44-f2bc-04a009379902\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local v = math.convertbase(\"FF\", 16, 10) -- \"255\"<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "cos": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Calculates the cosine of an angle given in radians.<\/div><\/div><div class=\"custom-section\"><div id=\"68799413-7d34-f662-6186-a4dfe664e4cf\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local c = math.cos(math.pi)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "counting": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Converts a number into a positive counting value.\n    The result is always greater than zero and rounded using floor or ceiling.<\/div><\/div><div class=\"custom-section\"><div id=\"2f14e5ee-2d12-ca4e-d3cd-6777e854e1f0\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   Input value.   <strong><em>boolean<\/em><\/strong>   <em>bRaise<\/em>   If true, rounds upward instead of downward.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e72fecd6-0784-2029-1bf4-5f2759589e1b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nResult<\/em>   Counting number.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f41a675d-4188-6f04-4326-27206a1fc774\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    math.counting(-2.7) -- 2<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "deg": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Converts an angle from radians into degrees.<\/div><\/div><div class=\"custom-section\"><div id=\"38546958-6f7b-5acd-49ee-fdc7e3a92796\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local d = math.deg(math.pi) -- 180<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "drift": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Applies a random additive offset within a symmetric range.\n    The result varies by up to the drift amount in either direction.<\/div><\/div><div class=\"custom-section\"><div id=\"4c223469-53ad-356b-cec2-bf010e3fcdbc\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local v = math.drift(10, 2)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null

//—©_END_DOX_DEFAULT_INTRO_©—
class Dox {
    constructor() {
        if (Dox.instance) {
            return Dox.instance;
        }
        Dox.instance = this;
        this.data = doxData;
        this.activeFQXN = "Modules";
        this.restoreLocation();
        // Only local fragment links belong to the documentation navigator.
        document.body.addEventListener('click', (event) => {
            const anchor = event.target.closest('a[href]');
            if (!anchor || !anchor.getAttribute('href').startsWith('#')) {
                return;
            }
            const fragment = anchor.getAttribute('href').slice(1);
            if (!fragment) {
                event.preventDefault();
                return;
            }
            const path = this.pathFromFragment(fragment);
            if (this.fqxnIsValid(path)) {
                event.preventDefault();
                this.setActiveFQXN(path);
                this.updatePage();
            }
        });
        // History traversal renders the stored location without adding another entry.
        window.addEventListener('popstate', () => {
            this.restoreLocation();
            this.updatePage(false);
        });
        window.addEventListener('hashchange', () => {
            this.restoreLocation();
            this.updatePage(false);
        });
    }
    byID(id) {
        return document.getElementById(id);
    }
    static copyToClipboard(button) {
        const code = button.closest('.custom-section').querySelector('pre code, pre');
        if (!code) {
            return;
        }
        const textarea = document.createElement('textarea');
        textarea.value = code.textContent;
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.remove();
        button.textContent = copied ? 'Copied' : 'Copy failed';
        window.setTimeout(() => { button.textContent = 'Copy'; }, 1500);
    }
    fqxnIsValid(path) {
        return this.getDataByFQDN(path) !== null;
    }
    getActiveFQXN() {
        return this.activeFQXN;
    }
    getDataByFQDN(path) {
        let current = this.data;
        let node = null;
        for (const part of path.split('.')) {
            if (!current || !Object.prototype.hasOwnProperty.call(current, part)) {
                return null;
            }
            node = current[part];
            current = node.subtable;
        }
        return node;
    }
    makeLink(path, label) {
        const anchor = document.createElement('a');
        anchor.href = '#' + path.replace(/^Modules\.?/, '');
        anchor.textContent = label.split('%20').join(' ');
        anchor.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            this.setActiveFQXN(path);
            this.updatePage();
        });
        return anchor;
    }
    pathFromFragment(fragment) {
        let decoded;
        try {
            decoded = decodeURIComponent(fragment);
        } catch (_) {
            return '';
        }
        return 'Modules.' + decoded.replace(/^Modules\.?/, '').split(' ').join('%20');
    }
    restoreLocation() {
        const path = window.location.hash ? this.pathFromFragment(window.location.hash.slice(1)) : 'Modules';
        this.activeFQXN = this.fqxnIsValid(path) ? path : 'Modules';
    }
    setActiveFQXN(path) {
        if (!this.fqxnIsValid(path)) {
            return false;
        }
        this.activeFQXN = path;
        return true;
    }
    updateBreadcrumb() {
        const breadcrumb = this.byID('DOX_breadcrumb');
        breadcrumb.replaceChildren();
        const parts = this.activeFQXN.split('.');
        parts.forEach((part, index) => {
            const item = document.createElement('li');
            item.className = 'breadcrumb-item';
            const label = index === 0 ? 'Overview' : part;
            if (index === parts.length - 1) {
                item.textContent = label.split('%20').join(' ');
                item.classList.add('active');
                item.setAttribute('aria-current', 'page');
            } else {
                item.appendChild(this.makeLink(parts.slice(0, index + 1).join('.'), label));
            }
            breadcrumb.appendChild(item);
        });
    }
    updateContent() {
        const node = this.getDataByFQDN(this.activeFQXN);
        const content = this.byID('DOX_content');
        content.innerHTML = node.value || '<div class="dox-empty">Choose a topic from the navigation to explore its documentation.</div>';
        this.byID('DOX_topic').textContent = this.activeFQXN === 'Modules' ? 'Documentation overview' : this.activeFQXN.split('.').slice(-1)[0].split('%20').join(' ');
        this.byID('DOX_location').textContent = this.activeFQXN.replace(/^Modules\.?/, '').split('%20').join(' ') || 'Explore the project reference';
    }
    updateNavMenu() {
        const menu = this.byID('DOX_navmenu');
        menu.replaceChildren();
        const active = this.getDataByFQDN(this.activeFQXN);
        const parentPath = this.activeFQXN.split('.').slice(0, -1).join('.');
        const groupPath = active.subtable ? this.activeFQXN : parentPath;
        const group = this.getDataByFQDN(groupPath);
        const upPath = groupPath.split('.').slice(0, -1).join('.');
        this.byID('DOX_navheading').textContent = groupPath === 'Modules' ? 'Project reference' : groupPath.split('.').slice(-1)[0].split('%20').join(' ');
        if (upPath) {
            const item = document.createElement('li');
            const anchor = this.makeLink(upPath, '← Back to parent');
            anchor.className = 'nav-link dox-up';
            item.appendChild(anchor);
            menu.appendChild(item);
        }
        Object.keys(group.subtable || {}).sort().forEach((key) => {
            const path = groupPath + '.' + key;
            const item = document.createElement('li');
            item.className = 'nav-item';
            const anchor = this.makeLink(path, key);
            anchor.className = 'nav-link';
            if (path === this.activeFQXN) {
                anchor.classList.add('active');
                anchor.setAttribute('aria-current', 'page');
            }
            item.appendChild(anchor);
            menu.appendChild(item);
        });
    }
    updatePage(recordHistory = true) {
        this.updateNavMenu();
        this.updateBreadcrumb();
        this.updateContent();
        Prism.highlightAll();
        if (recordHistory) {
            const hash = this.activeFQXN === 'Modules' ? '' : '#' + this.activeFQXN.slice(8);
            if (window.location.hash !== hash) {
                history.pushState({ activeFQXN: this.activeFQXN }, '', window.location.pathname + window.location.search + hash);
            }
        }
    }
}


    function bootDox() {
        const oDox = new Dox();
        oDox.updatePage(false);
    }

    if (window.Prism) {
        bootDox();
    } else {
        window.addEventListener('load', bootDox);
    }
    </script>
</body>
