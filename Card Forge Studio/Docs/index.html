    <style>
            :root {
        --base-font-size: 16px;
        --page: #101824;
        --surface: #182435;
        --surface-raised: #203047;
        --border: #30445f;
        --text: #e4edf7;
        --muted: #9cabc1;
        --accent: #79baff;
        --accent-soft: #223e5d;
        --navbackground: #182435;
        --navlink: #bcd9fa;
        --navlinkhover: #ffffff;
        --sectiontitle: #dcecff;
        --sectiontitlebg: #203047;
        --sectioncontent: #e4edf7;
        --breadcrumb-background: #141f2e;
        --button-background: #2b4562;
        --button-border: #4b6c90;
        --button-hover: #365c85;
        --button-text: #edf6ff;
        --header-end: #1c2435;
        --header-start: #172b44;
        --link-hover: #b9ddff;
        --selected-border: #5487b6;
        --selected-text: #ffffff;
    }

    /* Page shell and compact project identity. */
    * { box-sizing: border-box; }
    html { font-size: var(--base-font-size); }
    body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        line-height: 1.65;
    }
    a { color: var(--accent); }
    a:hover { color: var(--link-hover); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #titlebg {
        padding: 24px 36px 22px;
        background: linear-gradient(120deg, var(--header-start), var(--header-end));
        border-bottom: 1px solid var(--border);
    }
    .dox-brand { color: var(--accent); font-weight: 800; letter-spacing: .14em; font-size: .85rem; }
    .dox-brand span { margin-left: 12px; color: var(--muted); font-size: .7rem; font-weight: 600; }
    #title { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 700; margin: 8px 0 0; letter-spacing: -.025em; }
    .dox-subtitle { margin: 3px 0 0; color: var(--muted); font-size: .85rem; }

    /* Breadcrumbs and selected items show the current location without relying on color alone. */
    #DOX_breadcrumb-wrapper { padding: 13px 36px; background: var(--breadcrumb-background); border-bottom: 1px solid var(--border); }
    #DOX_breadcrumb { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; font-size: .9rem; }
    .breadcrumb-item + .breadcrumb-item::before { content: "/"; color: var(--muted); padding-right: 8px; float: none; }
    .breadcrumb-item.active { color: var(--text); font-weight: 700; }
    .breadcrumb a { text-decoration: none; }
    .dox-workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 185px); }
    #DOX_navmenu_wrapper { background: var(--surface); padding: 26px 18px; border-right: 1px solid var(--border); }
    #DOX_navheading { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 0 12px; margin: 0 0 14px; overflow-wrap: anywhere; }
    #DOX_navmenu { margin: 0; padding: 0; list-style: none; gap: 5px; }
    #DOX_navmenu .nav-link { display: block; color: var(--navlink); padding: 11px 14px; border: 1px solid transparent; border-radius: 8px; text-decoration: none; overflow-wrap: anywhere; }
    #DOX_navmenu .nav-link:hover { background: var(--surface-raised); color: var(--navlinkhover); border-color: var(--border); }
    #DOX_navmenu .nav-link.active { background: var(--accent-soft); border-color: var(--selected-border); color: var(--selected-text); font-weight: 700; box-shadow: inset 3px 0 var(--accent); }
    #DOX_navmenu .dox-up { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }

    /* Content cards separate documentation sections while keeping examples readable. */
    #DOX_content_wrapper { padding: 28px 36px 60px; min-width: 0; }
    .dox-topic-header { margin: 0 auto 24px; max-width: 1050px; }
    #DOX_location { color: var(--muted); font-size: .8rem; margin: 0 0 4px; overflow-wrap: anywhere; }
    #DOX_topic { font-size: 1.75rem; letter-spacing: -.025em; margin: 0; overflow-wrap: anywhere; }
    #DOX_content { max-width: 1050px; margin: 0 auto; }
    #DOX_content > .container-fluid { padding: 0; }
    .custom-section { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; background: var(--surface); overflow: hidden; box-shadow: 0 5px 18px #0002; }
    .section-title { padding: 12px 20px; background: var(--sectiontitlebg); color: var(--sectiontitle); font-size: .85rem; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .section-content { color: var(--sectioncontent); padding: 20px; overflow-wrap: anywhere; }
    .section-content > :last-child { margin-bottom: 0; }
    .dox-empty { padding: 28px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); }
    .DOX_intro { color: var(--text); }
    .DOX_intro .p-5 { padding: 28px !important; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .DOX_intro h1 { font-size: 1.6rem; }
    .DOX_intro .lead { font-size: 1rem; color: var(--muted); }
    pre { white-space: pre-wrap !important; overflow-wrap: anywhere; border-radius: 8px; font-size: .9rem; }
    .copy-to-clipboard-button { background: var(--button-background); color: var(--button-text); border: 1px solid var(--button-border); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: .8rem; }
    .copy-to-clipboard-button:hover { background: var(--button-hover); }
    .section-content table { color: var(--text); --bs-table-bg: transparent; --bs-table-color: var(--text); --bs-table-border-color: var(--border); --bs-table-striped-color: var(--text); }

    /* Narrow screens retain both navigation and content without horizontal page overflow. */
    @media (max-width: 760px) {
        #titlebg, #DOX_breadcrumb-wrapper { padding-left: 20px; padding-right: 20px; }
        .dox-workspace { grid-template-columns: 1fr; }
        #DOX_navmenu_wrapper { border-right: 0; border-bottom: 1px solid var(--border); padding: 18px; }
        #DOX_navmenu { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        #DOX_content_wrapper { padding: 24px 18px 40px; }
        .section-content { padding: 16px; }
    }

            "Forge": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <h2>Forge<\/h2>\n\n    <p>\n      The <strong>Forge<\/strong> is the card rendering and preview subsystem for Card Forge Studio.\n      It draws the currently selected card from ProcSys onto a dedicated canvas, maintains internal\n      render targets for composition, and provides editor-facing visual utilities (rulers, centerlines, etc.).\n    <\/p>\n\n    <h3>Responsibilities<\/h3>\n    <ul>\n      <li><strong>Card preview rendering<\/strong> – Draws the active card by executing the active CardSet’s live <code>Draw<\/code> script against the current row data.<\/li>\n      <li><strong>Offscreen composition<\/strong> – Renders card artwork and utility overlays into separate images, then composites them onto the canvas.<\/li>\n      <li><strong>Live scripting integration<\/strong> – Loads and executes the CardSet <code>Draw<\/code> chunk via the UserEnv, supporting a live-update workflow.<\/li>\n      <li><strong>Utility overlays<\/strong> – Draws editor aids such as horizontal/vertical rulers and centerlines as a separate overlay layer.<\/li>\n      <li><strong>Mouse feedback & status<\/strong> – Tracks mouse position over the canvas and updates dedicated status paragraph objects with scaled coordinates.<\/li>\n      <li><strong>Clipboard convenience<\/strong> – Supports copying mouse coordinate readouts via mouse click actions.<\/li>\n      <li><strong>Resize-aware redraw<\/strong> – Handles window/canvas resizing by deferring redraw until resizing stabilizes, then re-rendering the last active row.<\/li>\n      <li><strong>Style system<\/strong> – Loads FontStyle definitions from an INI source, exposes style lookup behavior, and supports optional auto-refresh of style state.<\/li>\n      <li><strong>Image caching<\/strong> – Caches user image handles/IDs to avoid redundant loads during repeated draws.<\/li>\n    <\/ul>\n\n    <h3>Render model<\/h3>\n    <ul>\n      <li>The Forge maintains multiple internal image targets: a primary card image, a utility overlay image, and an export image target.<\/li>\n      <li>Each draw clears to transparent, executes the CardSet draw routine, renders utility overlays, and composites the results onto the canvas.<\/li>\n      <li>Canvas mouse coordinates are scaled back into card-space using internally maintained conversion factors.<\/li>\n    <\/ul>\n\n    <h3>Lifecycle<\/h3>\n    <ol>\n      <li><strong>OnShow<\/strong> creates the canvas (one-time), restores window placement, installs mouse callbacks, and starts the redraw timer.<\/li>\n      <li><strong>SetActiveCardSet<\/strong> updates card dimensions and recreates internal render targets for the new set.<\/li>\n      <li><strong>DrawCard<\/strong> renders the active card row and overlay layers, then composites them to the canvas.<\/li>\n      <li><strong>OnSize<\/strong> recomputes layout for canvas + status objects and queues a deferred redraw when appropriate.<\/li>\n      <li><strong>OnTimer<\/strong> fulfills deferred redraw requests once resizing has settled.<\/li>\n    <\/ol>\n\n    <h3>Notes<\/h3>\n    <ul>\n      <li>Utility overlays are editor aids and are rendered separately from card artwork, allowing them to be enabled/disabled without modifying the CardSet draw script or affecting the exports.<\/li>\n      <li>CardSet draw logic is executed in the configured UserEnv, keeping drawing behavior set-specific while the Forge remains a generic renderer/compositor.<\/li>\n    <\/ul><\/div><\/div><\/div>`,
                "subtable": {
                "DrawImage": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Draws an image onto the active card render target.\n\n            <p>\n              Loads (or retrieves from cache) an image from the active game directory and draws it\n              into the current card draw context. This method is primarily intended for use by\n              CardSet <code>Draw<\/code> scripts, but may also be used internally by the Forge.\n            <\/p>\n\n            <h3>Behavior<\/h3>\n            <ul>\n              <li>Resolves the image path relative to the active game folder.<\/li>\n              <li>Sanitizes the provided path to prevent invalid or unsafe access.<\/li>\n              <li>Caches image handles to avoid redundant loads across draw calls.<\/li>\n              <li>Draws the image using alpha blending.<\/li>\n            <\/ul>\n\n            <h3>Notes<\/h3>\n            <ul>\n              <li>This method must be called from within an active card draw pass.<\/li>\n              <li>Images are drawn into the card image layer, not the utility overlay layer.<\/li>\n              <li>Repeated calls with the same image path reuse cached image handles.<\/li>\n            <\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"ecaee8f5-41ea-f256-316d-cfb18242b81b\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>pImage<\/em>    Relative image path (from the game directory).   <strong><em>number<\/em><\/strong>   <em>nX<\/em>        X position in card-space coordinates.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>        Y position in card-space coordinates.   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>    Draw width in card-space units.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>   Draw height in card-space units.   <strong><em>string<\/em><\/strong>   <em>sName<\/em>     Optional image identifier used for error reporting.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bcbedfa1-86a4-42e3-8111-3bfb2c65a72e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">            -- Draw an image asset onto the card at a fixed position\n            local pOgre = \"Images/Ogre.png\";\n            Forge.DrawImage(pOgre, 100, 100, 32, 32);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },

                "DrawStyledText": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Draws text containing inline style markup onto the active card render target.\n\n<p>\n  Renders text that includes inline style tags (e.g. <code>&lt;BOLD&gt;<\/code>,\n  <code>&lt;ITALIC&gt;<\/code>) using multiple FontStyles in a single draw call.\n  This method is intended for CardSet <code>Draw<\/code> scripts that require\n  rich text composition.\n<\/p>\n\n<h3>Behavior<\/h3>\n<ul>\n  <li>Parses inline style tags and resolves them against <code>Forge.STYLE<\/code>.<\/li>\n  <li>Preserves style runs across wrapped lines.<\/li>\n  <li>Uses ink-box layout to neutralize negative bearings and kerning artifacts.<\/li>\n  <li>Supports centering, rotation, and custom wrapping behavior.<\/li>\n<\/ul>\n\n<h3>Notes<\/h3>\n<ul>\n  <li>Must be called from within an active card draw pass.<\/li>\n  <li>Tags that do not resolve to a known style fall back to the base style.<\/li>\n  <li>Returns the top-left position and total size of the rendered text block.<\/li>\n<\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"6872beb6-73b2-2602-100a-3094fa60dc64\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em><\/em>   sStyle   Base FontStyle name.   <strong><em>number<\/em><\/strong>   <em><\/em>   nRawX    Base X position in card-space coordinates.   <strong><em>number<\/em><\/strong>   <em><\/em>   nRawY    Base Y position in card-space coordinates.   <strong><em>string<\/em><\/strong>   <em><\/em>   sText    Text with inline style markup.   <strong><em>boolean<\/em><\/strong>   <em>vCenterX<\/em>   Optional horizontal centering flag.   <strong><em>boolean<\/em><\/strong>   <em>vCenterY<\/em>   Optional vertical centering flag.   <strong><em>number<\/em><\/strong>   <em><\/em>   vAngle   Optional rotation angle (degrees).   <strong><em>function|nil<\/em><\/strong>   <em>vWrap<\/em>   Optional wrapping function.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f9b006ea-5c43-439f-378e-a006fdee53d5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nX<\/em>         Top-left X position of the rendered block.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>         Top-left Y position of the rendered block.   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>     Total width of the rendered block.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>    Total height of the rendered block.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d8d4e414-a84b-27a6-20b8-4269867c66c2\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">-- Draw a description line with inline emphasis\n-- Note: there must exist a Style named \"BOLD\"\nForge.DrawStyledText(\n    \"BODY\",\n    60, 820,\n    \"Deal <BOLD>3 damage<\/BOLD> to all enemy units.\",\n    false, false\n);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "DrawText": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Draws plain text onto the active card render target using a single style.\n\n<p>\n  Renders text using the specified FontStyle during the active card draw pass.\n  This method is intended for use by CardSet <code>Draw<\/code> scripts and supports\n  optional centering, rotation, and custom wrapping behavior.\n<\/p>\n\n<h3>Behavior<\/h3>\n<ul>\n  <li>Uses the specified style from <code>Forge.STYLE<\/code>.<\/li>\n  <li>Optionally centers text around the provided coordinates.<\/li>\n  <li>Supports rotated text via an angle parameter.<\/li>\n  <li>Supports custom line-wrapping through a user-supplied wrapper function.<\/li>\n<\/ul>\n\n<h3>Notes<\/h3>\n<ul>\n  <li>Must be called from within an active card draw pass.<\/li>\n  <li>Text is drawn into the card image layer, not the utility overlay.<\/li>\n  <li>Returns the final draw position and measured size of the last rendered line.<\/li>\n<\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"7435eb44-317e-e441-1ed4-27bfec6b25f7\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em><\/em>   sStyle   Name of the FontStyle to use.   <strong><em>number<\/em><\/strong>   <em><\/em>   nRawX    Base X position in card-space coordinates.   <strong><em>number<\/em><\/strong>   <em><\/em>   nRawY    Base Y position in card-space coordinates.   <strong><em>string<\/em><\/strong>   <em><\/em>   sText    Text to draw.   <strong><em>boolean<\/em><\/strong>   <em>vCenterX<\/em>   Optional horizontal centering flag.   <strong><em>boolean<\/em><\/strong>   <em>vCenterY<\/em>   Optional vertical centering flag.   <strong><em>number<\/em><\/strong>   <em><\/em>   vAngle   Optional rotation angle (degrees).   <strong><em>function|nil<\/em><\/strong>   <em>vWrap<\/em>   Optional wrapping function.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b44dfeb2-12c6-3a85-44ab-847bd57b5be0\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nX<\/em>         Final X position of the last line drawn.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>         Final Y position of the last line drawn.   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>     Width of the rendered text block.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>    Height of the rendered text block.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2dc0b61b-d0dc-acf4-3a4c-617196d68b2a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">-- Draw centered title text near the top of the card\nForge.DrawText(\n    \"TITLE\",\n    412, 60,\n    \"Example Card\",\n    true, true\n);<\/code><\/pre><\/div><\/div><\/div>`,

        "UserEnv": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <div class=\"mb-4\">\n\n  <div class=\"d-flex align-items-center mb-3\">\n    <div style=\"width:6px;height:36px;background:#4dd0e1;border-radius:3px;\" class=\"me-3\"><\/div>\n    <h2 class=\"mb-0 fw-bold\">UserEnv<\/h2>\n  <\/div>\n\n  <p>\n    <strong>UserEnv<\/strong> defines the controlled execution environment for CardSet\n    <code>Draw<\/code> scripts and other user-authored code. It exposes a curated,\n    read-only API surface composed of drawing utilities, math helpers, randomness,\n    geometry functions, and engine-provided services, while preventing direct mutation\n    of engine state.\n  <\/p>\n\n  <hr class=\"border-secondary\">\n\n  <h3 class=\"fw-semibold\">Design<\/h3>\n  <ul>\n    <li>UserEnv is a <em>decoy environment<\/em> backed by internal engine tables.<\/li>\n    <li>All exposed tables are read-only via metatables.<\/li>\n    <li>Write attempts to injected namespaces raise errors.<\/li>\n    <li>Actual backing tables are tracked separately for introspection.<\/li>\n  <\/ul>\n\n  <h3 class=\"fw-semibold\">Exposed Namespaces<\/h3>\n  <ul>\n    <li>Rendering and drawing facilities used during card and asset composition.<\/li>\n    <li>Color construction, conversion, and blending utilities for visual output.<\/li>\n    <li>Mathematical helpers extending the standard language primitives.<\/li>\n    <li>String and table helpers for validation, transformation, and structural work.<\/li>\n    <li>Geometric utilities for layout, bounds checking, and spatial reasoning.<\/li>\n    <li>Randomization helpers intended for deterministic or controlled variation.<\/li>\n    <li>Read-only configuration data scoped to the active game.<\/li>\n    <li>Session-scoped storage managed by the IDE for transient state.<\/li>\n    <li>Encoding utilities for safely representing binary data as text.<\/li>\n  <\/ul>\n\n  <h3 class=\"fw-semibold\">Dynamic Injection<\/h3>\n  <ul>\n    <li>Additional namespaces may be injected or replaced at runtime by the IDE.<\/li>\n    <li><code>ProcSysUpdateRoot<\/code> updates ProcSys-provided bindings.<\/li>\n    <li><code>UserUpdateRoot<\/code> updates user/session bindings.<\/li>\n    <li>Injected keys are tracked and safely replaced on refresh.<\/li>\n  <\/ul>\n\n  <h3 class=\"fw-semibold\">Introspection<\/h3>\n  <ul>\n    <li><code>UserEnv.Get()<\/code> returns the active execution environment table.<\/li>\n    <li>\n      <code>UserEnv.GetCommandList()<\/code> returns a sorted list of callable API paths\n      (e.g. <code>Forge.DrawImage<\/code>, <code>math.abs<\/code>).\n    <\/li>\n  <\/ul>\n\n  <h3 class=\"fw-semibold\">Safety Guarantees<\/h3>\n  <ul>\n    <li>No direct access to engine internals or mutable state.<\/li>\n    <li>All exposed namespaces are read-only.<\/li>\n    <li>Only explicitly injected APIs are visible.<\/li>\n    <li>Backing tables are weakly referenced to avoid lifetime leaks.<\/li>\n  <\/ul>\n\n  <h3 class=\"fw-semibold\">Notes<\/h3>\n  <ul>\n    <li>UserEnv is constructed and maintained by the IDE, not by user scripts.<\/li>\n    <li>User scripts should treat all exposed tables as immutable.<\/li>\n  <\/ul>\n\n<\/div><\/div><\/div><\/div>`,

            "Color": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <div class=\"mb-4\">\n\n  <div class=\"d-flex align-items-center mb-3\">\n    <div style=\"width:6px;height:36px;background:#81c784;border-radius:3px;\" class=\"me-3\"><\/div>\n    <h2 class=\"mb-0 fw-bold\">Color<\/h2>\n  <\/div>\n\n  <p>\n    Provides color construction, conversion, and manipulation utilities for drawing\n    and UI workflows.\n  <\/p>\n\n  <p>\n    This module supports 24-bit RGB and 32-bit RGBA color values, channel extraction\n    and mutation, alpha blending and mixing, gradient calculation, and hexadecimal\n    conversions. All functions return numeric color values compatible with drawing\n    operations exposed by the environment.\n  <\/p>\n\n  <hr class=\"border-secondary\">\n\n  <dl class=\"row mb-0\">\n    <dt class=\"col-sm-3 text-muted\">Author<\/dt>\n    <dd class=\"col-sm-9\">Imagine Programming &lt;Bas Groothedde&gt;<\/dd>\n\n    <dt class=\"col-sm-3 text-muted\">Web<\/dt>\n    <dd class=\"col-sm-9\">\n      <a href=\"http://www.imagine-programming.com\" class=\"link-info\">\n        http://www.imagine-programming.com\n      <\/a>\n    <\/dd>\n\n    <dt class=\"col-sm-3 text-muted\">Contact<\/dt>\n    <dd class=\"col-sm-9\">contact@imagine-programming.com<\/dd>\n\n    <dt class=\"col-sm-3 text-muted\">Copyright<\/dt>\n    <dd class=\"col-sm-9\">© Imagine Programming, 2024.<\/dd>\n  <\/dl>\n\n<\/div><\/div><\/div><\/div>`,

                "AlphaBlend": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Blends two 32-bit RGBA color values together while preserving their alpha channels. The second color is composited over the first color, producing a new combined color.<\/div><\/div><div class=\"custom-section\"><div id=\"e999ddbf-bec8-c82e-95bf-a259803231b5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color1<\/em>   A base color value, typically created with Color.RGBA.   <strong><em>number<\/em><\/strong>   <em>Color2<\/em>   A second color value, also created with Color.RGBA, which is blended on top of Color1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"704877ad-ad22-18fb-de9e-e465c8f2462c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   a new 32-bit color value representing the blended result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"90586fb5-882f-3234-4eb0-6f5133c7e76b\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nBlendedColor = Color.AlphaBlend(nBaseColor, nOverlayColor)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "AlphaMix": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Mixes two 32-bit RGBA color values together while preserving alpha information. The resulting color is blended using an explicit alpha value, allowing control over how transparency is applied in the mix.<\/div><\/div><div class=\"custom-section\"><div id=\"d93342b4-0bc6-5075-60c8-b3b0fa7deacf\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color1<\/em>   A base color value, typically created with Color.RGBA.   <strong><em>number<\/em><\/strong>   <em>Color2<\/em>   A second color value, also created with Color.RGBA, mixed on top of Color1.   <strong><em>number<\/em><\/strong>   <em>Alpha<\/em>   The alpha value to apply during mixing, usually sourced from an existing color.<br><\/div><\/div><div class=\"custom-section\"><div id=\"968625ad-ccb6-67c2-97a2-e26c1fd45c4d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   a new 32-bit color value representing the mixed result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"09c4a901-904b-8e66-977f-d74efc1bda31\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nMixedColor = Color.AlphaMix(nPrimaryColor, nSecondaryColor, Color.GetAlpha(nReferenceColor))<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "GetAlpha": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Extracts the alpha channel from a 32-bit RGBA color value, allowing inspection of the transparency component.<\/div><\/div><div class=\"custom-section\"><div id=\"bc3d4b07-9be5-355e-540d-85df15c1be55\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A numeric color value created with Color.RGBA.<br><\/div><\/div><div class=\"custom-section\"><div id=\"06bb21d4-1a41-a6fd-7306-5fb7e2239bec\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   the alpha channel value, ranging from 0 to 255.<br><\/div><\/div><div class=\"custom-section\"><div id=\"85f38ded-930f-0c3e-388a-908280508a6c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nAlphaValue = Color.GetAlpha(nColor)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "GetBlue": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Extracts the blue channel from a 24-bit or 32-bit color value, allowing inspection of the original color components.<\/div><\/div><div class=\"custom-section\"><div id=\"d88c3509-1795-cb9b-143e-3ebf645e619c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A numeric color value created with Color.RGB or Color.RGBA.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8cdc49e0-46e7-9fc6-56a8-d2eb6a8c5a25\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   the blue channel value, ranging from 0 to 255.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b1d834db-92dd-c430-42af-01eb37e13ffa\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nBlueValue = Color.GetBlue(nColor)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "GetGreen": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Extracts the green channel from a 24-bit or 32-bit color value.\n    This allows inspection of the exact green component used in a color.<\/div><\/div><div class=\"custom-section\"><div id=\"5c63db92-9e10-8582-9b23-d892b5c999bf\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A numeric color value produced by Color.RGB or Color.RGBA.<br><\/div><\/div><div class=\"custom-section\"><div id=\"75ba0c9d-ca39-a3f2-ef44-28126d0271ab\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   the green channel value, ranging from 0 to 255.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b333812d-ec75-5008-de9f-4da1b780a2a8\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nGreenValue = Color.GetGreen(nSomeColor)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "GetRed": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Extracts the red channel from a 24-bit or 32-bit color value.\n    This is useful for inspecting or decomposing colors created with Color.RGB or Color.RGBA.<\/div><\/div><div class=\"custom-section\"><div id=\"b2914fce-d641-f937-ea3c-af80fc9c1b56\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A numeric color value produced by Color.RGB or Color.RGBA.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d46f9381-00bc-9ac1-5c0a-f53f1b44c11e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   the red component as an integer in the range 0–255.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0491a75a-3471-7530-df81-e43f17864b79\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nRedComponent = Color.GetRed(nColorValue)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "HexToRGB": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Converts a hexadecimal RGB color string into a 24-bit numeric color value usable in drawing operations. The expected format is #RRGGBB, where each pair represents red, green, and blue components.<\/div><\/div><div class=\"custom-section\"><div id=\"5055f986-4001-0bec-c413-e081ca58fba8\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>HexadecimalColor<\/em>   A hexadecimal color string, such as one produced by Color.RGBToHex or a standard HTML color code.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bae5f3ad-7c2f-6bed-75b0-71466c916779\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   a 24-bit numeric RGB color value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"fd4387a7-4c4d-a51e-03f7-0d6a5828a973\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nDarkerGreen = Color.HexToRGB(\"#00be00\")<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "HexToRGBA": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Converts a hexadecimal RGBA color string into a 32-bit numeric color value usable in drawing operations. The expected format is #RRGGBBAA, where each pair represents red, green, blue, and alpha components.<\/div><\/div><div class=\"custom-section\"><div id=\"502b6e25-cddd-fcd8-c31f-78b848d69c57\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>HexadecimalColor<\/em>   A hexadecimal color string, such as one produced by Color.RGBAToHex.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3acd7605-5227-6e96-2577-812fc2bde3be\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   a 32-bit numeric RGBA color value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6eb9e9a3-9b07-70b6-5057-eecf6a133b0f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nDarkerTransparentGreen = Color.HexToRGBA(\"#00be007c\")<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RGB": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Calculates a 24-bit RGB color value composed of red, green, and blue components with no alpha channel.\n    Use this when opacity is not required; for colors with transparency, use Color.RGBA instead.<\/div><\/div><div class=\"custom-section\"><div id=\"6ef229fd-ecad-779d-2cb5-dd71b5b2a545\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Red<\/em>   The red component (0–255).   <strong><em>number<\/em><\/strong>   <em>Green<\/em>   The green component (0–255).   <strong><em>number<\/em><\/strong>   <em>Blue<\/em>   The blue component (0–255).<br><\/div><\/div><div class=\"custom-section\"><div id=\"e9a21d53-710b-368d-d98b-91ad7602377b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   the computed color as a single 24-bit numeric value suitable for drawing operations that accept color inputs.<br><\/div><\/div><div class=\"custom-section\"><div id=\"269907f0-dfca-b233-b877-ba446b274a0d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nGreenColor = Color.RGB(0, 255, 0)\n    local nPurpleColor = Color.RGB(255, 0, 255)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RGBA": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Calculates a 32-bit RGBA color value composed of red, green, blue, and alpha components.\n    The alpha channel controls opacity, allowing the color to be fully opaque or fully transparent.\n    Colors created this way can be blended or mixed during drawing operations.<\/div><\/div><div class=\"custom-section\"><div id=\"096f8131-6f34-aee9-0f7b-ad8f28528151\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Red<\/em>   The red component (0–255).   <strong><em>number<\/em><\/strong>   <em>Green<\/em>   The green component (0–255).   <strong><em>number<\/em><\/strong>   <em>Blue<\/em>   The blue component (0–255).   <strong><em>number<\/em><\/strong>   <em>Alpha<\/em>   The alpha (opacity) component (0–255).<br><\/div><\/div><div class=\"custom-section\"><div id=\"f4ea90d8-e80a-cef9-8b5f-5a68d2cce570\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   the computed color as a single 32-bit numeric value suitable for drawing operations that accept color inputs.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2cabf574-0962-0b9f-2781-91b08cb20222\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nSemiTransparentRed = Color.RGBA(200, 0, 0, 190)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RGBAAtOffset": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Computes an interpolated RGBA color between two 32-bit colors at a given percentage offset. The offset represents the distance from the first color toward the second, expressed as a value from 0 to 100. This variant preserves and interpolates the alpha channel as part of the gradient.<\/div><\/div><div class=\"custom-section\"><div id=\"be2e8203-f545-cd2b-85b2-a180567889e8\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color1<\/em>   The starting 32-bit RGBA color value.   <strong><em>number<\/em><\/strong>   <em>Color2<\/em>   The ending 32-bit RGBA color value.   <strong><em>number<\/em><\/strong>   <em>Distance<\/em>   Percentage distance from Color1 toward Color2 (0–100).<br><\/div><\/div><div class=\"custom-section\"><div id=\"9c6198ee-a8e4-327e-a05c-2da70cf7b71a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   a 32-bit RGBA color value at the specified offset.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b495f1e2-f158-07b7-9675-bf69e22d20e8\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nStepColor = Color.RGBAAtOffset(nStartColor,nEndColor,20)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RGBAGradientColors": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Calculates a sequence of RGBA color values that form a smooth gradient from a starting color to an ending color. The gradient is divided into a specified number of points, representing evenly spaced positions along the transition. This variant also interpolates the alpha channel, allowing transparency to flow across the gradient.<\/div><\/div><div class=\"custom-section\"><div id=\"15155409-7845-06e2-d0cd-b48019467768\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color1<\/em>   The starting 32-bit RGBA color value.   <strong><em>number<\/em><\/strong>   <em>Color2<\/em>   The ending 32-bit RGBA color value.   <strong><em>number<\/em><\/strong>   <em>Points<\/em>   The number of gradient points to generate.<br><\/div><\/div><div class=\"custom-section\"><div id=\"83781032-7bf0-6220-1024-ec845b6d6634\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>Returns<\/em>   a table containing RGBA color values for each gradient step, or nil on failure.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4398a7ad-b50b-4a56-dae8-3aa842a1d01c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    -- Make a test project with one page named Page1,\n    -- the size should be: Small (with menu bar) in\n    -- project settings -> Appearance.\n    -- Put this code in the On Show event of Page1.\n    Application.SetPageProperties(\"Page1\", {\n      UseCustomSettings = true;\n      BackgroundType = BG_SOLID;\n      BackgroundColor = Color.RGB(0,0,0);\n    });\n\n    local nPoints = 26;\n    local tColors = Color.RGBAGradientColors(\n      Color.RGBA(255,0,0,255),\n      Color.RGBA(0,255,0,80),\n      nPoints\n    );\n    -- One extra point is added internally to represent the 100% color.\n\n    local nY = 0;\n    for nPoint,nColor in pairs(tColors) do\n      Page.CreateObject(OBJECT_LABEL,\"label\"..nPoint,{\n        FontName = \"Courier New\";\n        FontSize = 10;\n        ColorNormal = nColor;\n        ColorHighlight = nColor;\n        ColorDown = nColor;\n        X = 5;\n        Y = nY;\n      });\n\n      Label.SetText(\"label\"..nPoint,\"The color at point \"..nPoint..\" in the list.\");\n      nY = nY + 10;\n    end<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RGBAToHex": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Converts a 32-bit RGBA color value into a hexadecimal color string. This format is useful for configuration, serialization, or user-defined color input where alpha transparency must be preserved.<\/div><\/div><div class=\"custom-section\"><div id=\"6abd6e3e-f708-e3fe-d219-62dc08837310\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A 32-bit color value, typically created with Color.RGBA.<br><\/div><\/div><div class=\"custom-section\"><div id=\"cddb5879-5775-a799-9bf8-3b779d246395\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>Returns<\/em>   a hexadecimal color code representing the RGBA color.<br><\/div><\/div><div class=\"custom-section\"><div id=\"df569778-f430-e03c-aa97-bdc219a75bf0\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local sHexRedTransparent = Color.RGBAToHex(Color.RGBA(255,0,0,180))<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RGBAtOffset": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Computes an interpolated RGB color between two 24-bit colors at a given percentage offset. The offset represents the distance from the first color toward the second, expressed as a value from 0 to 100.<\/div><\/div><div class=\"custom-section\"><div id=\"605a3b79-1d54-b16a-449e-2a5d9fe3e588\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color1<\/em>   The starting 24-bit RGB color value.   <strong><em>number<\/em><\/strong>   <em>Color2<\/em>   The ending 24-bit RGB color value.   <strong><em>number<\/em><\/strong>   <em>Distance<\/em>   Percentage distance from Color1 toward Color2 (0–100).<br><\/div><\/div><div class=\"custom-section\"><div id=\"4c60072b-2cf1-0d05-f1a5-f0ef41c60a1d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   a 24-bit RGB color value at the specified offset.<br><\/div><\/div><div class=\"custom-section\"><div id=\"debb009f-33fe-5958-38d9-a6ef1359def0\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nStepColor = Color.RGBAtOffset(nStartColor,nEndColor,20)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RGBGradientColors": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Calculates a sequence of RGB color values that form a smooth gradient from a starting color to an ending color. The number of generated colors is determined by the points argument, representing evenly spaced positions along the gradient.<\/div><\/div><div class=\"custom-section\"><div id=\"ad09329b-5335-0fa0-d29f-ea5f605d9e52\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color1<\/em>   The starting 24-bit RGB color value.   <strong><em>number<\/em><\/strong>   <em>Color2<\/em>   The ending 24-bit RGB color value.   <strong><em>number<\/em><\/strong>   <em>Points<\/em>   The number of gradient points to generate.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5db55829-7871-ce55-8c0b-b692b9023ad4\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>Returns<\/em>   a table containing RGB color values for each gradient step, or nil on failure.<br><\/div><\/div><div class=\"custom-section\"><div id=\"93cfc400-a7eb-2e31-6118-694435ff1748\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    -- Make a test project with one page named Page1,\n    -- the size should be: Small (with menu bar) in\n    -- project settings -> Appearance.\n    -- Put this code in the On Show event of Page1.\n    Application.SetPageProperties(\"Page1\", {\n      UseCustomSettings = true;\n      BackgroundType = BG_SOLID;\n      BackgroundColor = Color.RGB(0,0,0);\n    });\n\n    local nPoints = 26;\n    local tColors = Color.RGBGradientColors(Color.RGB(255,0,0),Color.RGB(0,255,0),nPoints);\n    -- One extra point is added internally to represent the 100% color.\n\n    local nY = 0;\n    for nPoint,nColor in pairs(tColors) do\n      Page.CreateObject(OBJECT_LABEL,\"label\"..nPoint,{\n        FontName = \"Courier New\";\n        FontSize = 10;\n        ColorNormal = nColor;\n        ColorHighlight = nColor;\n        ColorDown = nColor;\n        X = 5;\n        Y = nY;\n      });\n\n      Label.SetText(\"label\"..nPoint,\"The color at point \"..nPoint..\" in the list.\");\n      nY = nY + 10;\n    end<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RGBToHex": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Converts a 24-bit RGB color value into a hexadecimal color string. The resulting value is suitable for use in formats such as HTML or CSS, or for storage and user-facing configuration.<\/div><\/div><div class=\"custom-section\"><div id=\"06a7049f-e5ca-56aa-46e8-dc3e787f4bcc\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A 24-bit color value, typically created with Color.RGB.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6651ea26-d308-e2dc-90df-955307fac439\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>Returns<\/em>   a hexadecimal color code representing the input color.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2926ee83-16ef-26e2-f4be-8c17de1cd947\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local sHexRed = Color.RGBToHex(Color.RGB(255,0,0))<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "SetAlpha": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Replaces the alpha channel of a 32-bit RGBA color with a new value, producing a modified color with updated transparency.<\/div><\/div><div class=\"custom-section\"><div id=\"57c6d191-22f1-cad8-e208-7b503f341fe8\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A numeric color value created with Color.RGBA.   <strong><em>number<\/em><\/strong>   <em>NewValue<\/em>   The new alpha value, ranging from 0 to 255.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d6bf24c9-f156-e954-f05e-ccd2b22b5597\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   a new 32-bit color value with the alpha channel overwritten.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3f810006-a940-6a9a-4906-18757b798357\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nNewColor = Color.SetAlpha(nOldColor, 80)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "SetBlue": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Replaces the blue channel of a 24-bit or 32-bit color and returns a new color value with the updated component.<\/div><\/div><div class=\"custom-section\"><div id=\"4f028dd0-28bc-4167-b4ce-df41ae633a68\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A numeric color value created with Color.RGB or Color.RGBA.   <strong><em>number<\/em><\/strong>   <em>NewValue<\/em>   The new blue channel value, in the range 0 to 255.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e94ea3bd-d78a-2fb3-8eb6-c024d560edd2\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   the recalculated color value with the blue component overwritten.<br><\/div><\/div><div class=\"custom-section\"><div id=\"103cb7a5-d333-adb6-3277-b88ac3b90dfe\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nUpdatedColor = Color.SetBlue(nOriginalColor,255)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "SetGreen": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Replaces the green channel of a 24-bit or 32-bit color and returns a new color value with the updated component.<\/div><\/div><div class=\"custom-section\"><div id=\"bf14161e-5d26-cc18-faaa-0a2f82c463bf\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A numeric color value created with Color.RGB or Color.RGBA.   <strong><em>number<\/em><\/strong>   <em>NewValue<\/em>   The new green channel value, in the range 0 to 255.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ea52bf99-01d6-ade7-a673-ba7decb4a0a0\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   the recalculated color value with the green component overwritten.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1a351098-3d9f-3187-14fc-abff4445a0a4\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nUpdatedColor = Color.SetGreen(nOriginalColor, 120)<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "SetRed": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Updates the red channel of an existing 24-bit or 32-bit color value and returns a new color with the modified component.\n    All other color channels remain unchanged.<\/div><\/div><div class=\"custom-section\"><div id=\"c47b8a24-49f1-6e8d-8873-c08f2716a4e0\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Color<\/em>   A numeric color value produced by Color.RGB or Color.RGBA.   <strong><em>number<\/em><\/strong>   <em>NewValue<\/em>   The new red channel value, in the range 0–255.<br><\/div><\/div><div class=\"custom-section\"><div id=\"57473887-042f-7bc6-0fc1-3aef2ce8961f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>Returns<\/em>   a newly calculated color value with the red component replaced.<br><\/div><\/div><div class=\"custom-section\"><div id=\"05ab3950-0554-874b-55f4-31c5b65304ea\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nNewColor = Color.SetRed(nOldColor, 0) -- removes the red component<\/code><\/pre><\/div><\/div><\/div>`,

            "Drawing": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <section class=\"mb-5\">\n<h1>Imagine Draw<\/h1>\n<p>A plugin which will allow you to decode, encode and draw onto images. Draw has many supported formats, such as (Decoders): PNG, JPEG, JPEG2000, BMP, ICO, TIFF, TGA and (Encoders): PNG, JPEG, JPEG2000, BMP.\nUsing Draw, you can generate any image you want. Included are tons of functions for rotation, mirroring, flipping, drawing lines, boxes, circles, ellipses, gradients, images onto images, arcs, polygons, bold lines, pies.\nAll this can be done using blending modes, currently there are over 50 blending modes available in Draw. Aside from blending modes, a few filters have been added as well. These filters allow you to draw diagonal, horizontal and vertical lines in specific areas, to negate the colors in a specific area, darken and lighten colors and more!\nDraw also comes with functions to Load fonts, these allow you to preload an installed font and use them in your drawing code. You can draw text, angled text and determine the width and height calculated for a string of text you wish to draw.\nDraw supports many pixel formats, from 8 bits RGB to 32 bits RGBA. If you create a new image, you have to choose between 24 bits RGB, 32 bits RGB, and 32 bits RGBA.\nThe submodule Color inside Draw allows you to work with colors, color calculation, conversion to hexadecimal strings, conversion from hexadecimal strings, gradient calculation, alpha blending or mixing two colors.\nThe, previously developed by RizlaUK, Canvas plugin will also be a part of Draw. The completely redesigned Canvas object is ported with this version. The Canvas allows you to draw directly onto an Object in AMS. The Canvas object also allows events, grabbing mouse and keyboard input and more!<\/p>\n\n<hr class=\"border-secondary my-4\">\n\n<dl class=\"row mb-0\">\n  <dt class=\"col-sm-3\">Version<\/dt>\n  <dd class=\"col-sm-9\">2.0.0.0<\/dd>\n\n  <dt class=\"col-sm-3\">Author<\/dt>\n  <dd class=\"col-sm-9\">Imagine Programming &lt;Bas Groothedde&gt;<\/dd>\n\n  <dt class=\"col-sm-3\">Web<\/dt>\n  <dd class=\"col-sm-9\"><a href=\"http://www.imagine-programming.com\" class=\"link-info\">http://www.imagine-programming.com<\/a><\/dd>\n\n  <dt class=\"col-sm-3\">Email<\/dt>\n  <dd class=\"col-sm-9\">contact@imagine-programming.com<\/dd>\n\n  <dt class=\"col-sm-3\">Copyright<\/dt>\n  <dd class=\"col-sm-9\">© Imagine Programming, 2024.<\/dd>\n<\/dl>\n\n<hr class=\"border-secondary my-4\">\n\n<p class=\"mb-0\"><strong>Note:<\/strong> While the official manual occasionally lists the <strong>Drawing.DrawSquare<\/strong> method in some examples, that method has been deprecated. Use <strong>Drawing.DrawRectangle<\/strong> instead.<\/p>\n<\/section><\/div><\/div><\/div>`,

            "Forge": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <h2>Forge<\/h2>\n\n    <p>\n      The <strong>Forge<\/strong> is the card rendering and preview subsystem for Card Forge Studio.\n      It draws the currently selected card from ProcSys onto a dedicated canvas, maintains internal\n      render targets for composition, and provides editor-facing visual utilities (rulers, centerlines, etc.).\n    <\/p>\n\n    <h3>Responsibilities<\/h3>\n    <ul>\n      <li><strong>Card preview rendering<\/strong> – Draws the active card by executing the active CardSet’s live <code>Draw<\/code> script against the current row data.<\/li>\n      <li><strong>Offscreen composition<\/strong> – Renders card artwork and utility overlays into separate images, then composites them onto the canvas.<\/li>\n      <li><strong>Live scripting integration<\/strong> – Loads and executes the CardSet <code>Draw<\/code> chunk via the UserEnv, supporting a live-update workflow.<\/li>\n      <li><strong>Utility overlays<\/strong> – Draws editor aids such as horizontal/vertical rulers and centerlines as a separate overlay layer.<\/li>\n      <li><strong>Mouse feedback & status<\/strong> – Tracks mouse position over the canvas and updates dedicated status paragraph objects with scaled coordinates.<\/li>\n      <li><strong>Clipboard convenience<\/strong> – Supports copying mouse coordinate readouts via mouse click actions.<\/li>\n      <li><strong>Resize-aware redraw<\/strong> – Handles window/canvas resizing by deferring redraw until resizing stabilizes, then re-rendering the last active row.<\/li>\n      <li><strong>Style system<\/strong> – Loads FontStyle definitions from an INI source, exposes style lookup behavior, and supports optional auto-refresh of style state.<\/li>\n      <li><strong>Image caching<\/strong> – Caches user image handles/IDs to avoid redundant loads during repeated draws.<\/li>\n    <\/ul>\n\n    <h3>Render model<\/h3>\n    <ul>\n      <li>The Forge maintains multiple internal image targets: a primary card image, a utility overlay image, and an export image target.<\/li>\n      <li>Each draw clears to transparent, executes the CardSet draw routine, renders utility overlays, and composites the results onto the canvas.<\/li>\n      <li>Canvas mouse coordinates are scaled back into card-space using internally maintained conversion factors.<\/li>\n    <\/ul>\n\n    <h3>Lifecycle<\/h3>\n    <ol>\n      <li><strong>OnShow<\/strong> creates the canvas (one-time), restores window placement, installs mouse callbacks, and starts the redraw timer.<\/li>\n      <li><strong>SetActiveCardSet<\/strong> updates card dimensions and recreates internal render targets for the new set.<\/li>\n      <li><strong>DrawCard<\/strong> renders the active card row and overlay layers, then composites them to the canvas.<\/li>\n      <li><strong>OnSize<\/strong> recomputes layout for canvas + status objects and queues a deferred redraw when appropriate.<\/li>\n      <li><strong>OnTimer<\/strong> fulfills deferred redraw requests once resizing has settled.<\/li>\n    <\/ol>\n\n    <h3>Notes<\/h3>\n    <ul>\n      <li>Utility overlays are editor aids and are rendered separately from card artwork, allowing them to be enabled/disabled without modifying the CardSet draw script or affecting the exports.<\/li>\n      <li>CardSet draw logic is executed in the configured UserEnv, keeping drawing behavior set-specific while the Forge remains a generic renderer/compositor.<\/li>\n    <\/ul><\/div><\/div><\/div>`,
                "subtable": {
                "DrawImage": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Draws an image onto the active card render target.\n\n            <p>\n              Loads (or retrieves from cache) an image from the active game directory and draws it\n              into the current card draw context. This method is primarily intended for use by\n              CardSet <code>Draw<\/code> scripts, but may also be used internally by the Forge.\n            <\/p>\n\n            <h3>Behavior<\/h3>\n            <ul>\n              <li>Resolves the image path relative to the active game folder.<\/li>\n              <li>Sanitizes the provided path to prevent invalid or unsafe access.<\/li>\n              <li>Caches image handles to avoid redundant loads across draw calls.<\/li>\n              <li>Draws the image using alpha blending.<\/li>\n            <\/ul>\n\n            <h3>Notes<\/h3>\n            <ul>\n              <li>This method must be called from within an active card draw pass.<\/li>\n              <li>Images are drawn into the card image layer, not the utility overlay layer.<\/li>\n              <li>Repeated calls with the same image path reuse cached image handles.<\/li>\n            <\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"ecaee8f5-41ea-f256-316d-cfb18242b81b\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>pImage<\/em>    Relative image path (from the game directory).   <strong><em>number<\/em><\/strong>   <em>nX<\/em>        X position in card-space coordinates.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>        Y position in card-space coordinates.   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>    Draw width in card-space units.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>   Draw height in card-space units.   <strong><em>string<\/em><\/strong>   <em>sName<\/em>     Optional image identifier used for error reporting.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bcbedfa1-86a4-42e3-8111-3bfb2c65a72e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">            -- Draw an image asset onto the card at a fixed position\n            local pOgre = \"Images/Ogre.png\";\n            Forge.DrawImage(pOgre, 100, 100, 32, 32);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "DrawStyledText": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Draws text containing inline style markup onto the active card render target.\n\n<p>\n  Renders text that includes inline style tags (e.g. <code>&lt;BOLD&gt;<\/code>,\n  <code>&lt;ITALIC&gt;<\/code>) using multiple FontStyles in a single draw call.\n  This method is intended for CardSet <code>Draw<\/code> scripts that require\n  rich text composition.\n<\/p>\n\n<h3>Behavior<\/h3>\n<ul>\n  <li>Parses inline style tags and resolves them against <code>Forge.STYLE<\/code>.<\/li>\n  <li>Preserves style runs across wrapped lines.<\/li>\n  <li>Uses ink-box layout to neutralize negative bearings and kerning artifacts.<\/li>\n  <li>Supports centering, rotation, and custom wrapping behavior.<\/li>\n<\/ul>\n\n<h3>Notes<\/h3>\n<ul>\n  <li>Must be called from within an active card draw pass.<\/li>\n  <li>Tags that do not resolve to a known style fall back to the base style.<\/li>\n  <li>Returns the top-left position and total size of the rendered text block.<\/li>\n<\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"6872beb6-73b2-2602-100a-3094fa60dc64\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em><\/em>   sStyle   Base FontStyle name.   <strong><em>number<\/em><\/strong>   <em><\/em>   nRawX    Base X position in card-space coordinates.   <strong><em>number<\/em><\/strong>   <em><\/em>   nRawY    Base Y position in card-space coordinates.   <strong><em>string<\/em><\/strong>   <em><\/em>   sText    Text with inline style markup.   <strong><em>boolean<\/em><\/strong>   <em>vCenterX<\/em>   Optional horizontal centering flag.   <strong><em>boolean<\/em><\/strong>   <em>vCenterY<\/em>   Optional vertical centering flag.   <strong><em>number<\/em><\/strong>   <em><\/em>   vAngle   Optional rotation angle (degrees).   <strong><em>function|nil<\/em><\/strong>   <em>vWrap<\/em>   Optional wrapping function.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f9b006ea-5c43-439f-378e-a006fdee53d5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nX<\/em>         Top-left X position of the rendered block.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>         Top-left Y position of the rendered block.   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>     Total width of the rendered block.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>    Total height of the rendered block.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d8d4e414-a84b-27a6-20b8-4269867c66c2\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">-- Draw a description line with inline emphasis\n-- Note: there must exist a Style named \"BOLD\"\nForge.DrawStyledText(\n    \"BODY\",\n    60, 820,\n    \"Deal <BOLD>3 damage<\/BOLD> to all enemy units.\",\n    false, false\n);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "DrawText": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Draws plain text onto the active card render target using a single style.\n\n<p>\n  Renders text using the specified FontStyle during the active card draw pass.\n  This method is intended for use by CardSet <code>Draw<\/code> scripts and supports\n  optional centering, rotation, and custom wrapping behavior.\n<\/p>\n\n<h3>Behavior<\/h3>\n<ul>\n  <li>Uses the specified style from <code>Forge.STYLE<\/code>.<\/li>\n  <li>Optionally centers text around the provided coordinates.<\/li>\n  <li>Supports rotated text via an angle parameter.<\/li>\n  <li>Supports custom line-wrapping through a user-supplied wrapper function.<\/li>\n<\/ul>\n\n<h3>Notes<\/h3>\n<ul>\n  <li>Must be called from within an active card draw pass.<\/li>\n  <li>Text is drawn into the card image layer, not the utility overlay.<\/li>\n  <li>Returns the final draw position and measured size of the last rendered line.<\/li>\n<\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"7435eb44-317e-e441-1ed4-27bfec6b25f7\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em><\/em>   sStyle   Name of the FontStyle to use.   <strong><em>number<\/em><\/strong>   <em><\/em>   nRawX    Base X position in card-space coordinates.   <strong><em>number<\/em><\/strong>   <em><\/em>   nRawY    Base Y position in card-space coordinates.   <strong><em>string<\/em><\/strong>   <em><\/em>   sText    Text to draw.   <strong><em>boolean<\/em><\/strong>   <em>vCenterX<\/em>   Optional horizontal centering flag.   <strong><em>boolean<\/em><\/strong>   <em>vCenterY<\/em>   Optional vertical centering flag.   <strong><em>number<\/em><\/strong>   <em><\/em>   vAngle   Optional rotation angle (degrees).   <strong><em>function|nil<\/em><\/strong>   <em>vWrap<\/em>   Optional wrapping function.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b44dfeb2-12c6-3a85-44ab-847bd57b5be0\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nX<\/em>         Final X position of the last line drawn.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>         Final Y position of the last line drawn.   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>     Width of the rendered text block.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>    Height of the rendered text block.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2dc0b61b-d0dc-acf4-3a4c-617196d68b2a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">-- Draw centered title text near the top of the card\nForge.DrawText(\n    \"TITLE\",\n    412, 60,\n    \"Example Card\",\n    true, true\n);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "Import": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">       Loads and executes a Lua file from within the active game's directory, then returns the chunk results.\n\n    The import path is treated as a relative path rooted at the user's currently active game (the game’s root folder). Absolute paths and traversal are rejected. The file is read as text, compiled with the UserEnv execution environment, and run protected so errors can be returned instead of crashing the caller.\n\n    All code inside the imported file is executed sandboxed within the UserEnv. The file has access only to the APIs explicitly exposed by the user environment, ensuring imported code cannot escape or access unsafe globals.<\/div><\/div><div class=\"custom-section\"><div id=\"5905577b-e78c-4470-f039-d504d7db69ab\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPathRaw<\/em>   Relative path to a Lua file inside the active game (for example: \"Scripts/MyModule.lua\").   <strong><em>any<\/em><\/strong>   <em>vMessage<\/em>   Optional extra text appended to error output.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4b199ad5-96a2-4a76-dbd2-d28225c7e968\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>...<\/em>   On success, returns whatever values the imported file returns.   <strong><em>nil<\/em><\/strong>   <em>On<\/em>   failure, returns nil as the first result.   <strong><em>string<\/em><\/strong>   <em>sError<\/em>   On failure, returns an error message as the second result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"15fdcc48-b1cc-69e0-0ce0-413487b25a1d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local vModule = Import(\"Scripts/MyModule.lua\");<\/code><\/pre><\/div><\/div><\/div>`,

                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a font style object by name.<\/div><\/div><div class=\"custom-section\"><div id=\"6dde793e-651d-2c5d-5a92-67798e9576e9\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   The name of the font style to retrieve.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f608b567-73eb-1264-a3e6-2f7f8c62d4d6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>FontStyle|nil<\/em><\/strong>   <em>oFontStyle<\/em>   The matching FontStyle object, or nil if not found.<br><\/div><\/div><\/div>`,
